{% extends 'base.html' %}
{% block title %}404 - Page Not Found | {{ dealer_settings.dealership_name }}{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="display-1 text-danger fw-bold">404</div>
    <h2 class="fw-bold text-dark mt-3">Page Not Found</h2>
    <p class="text-muted lead mb-4">The page or car listing you are looking for does not exist or has been removed.</p>
    <div class="d-flex justify-content-center gap-3">
        <a href="{% url 'public_home' %}" class="btn btn-primary fw-bold">
            <i class="bi bi-house-door-fill me-1"></i> Go to Homepage
        </a>
        <a href="{% url 'public_cars' %}" class="btn btn-outline-secondary fw-bold">
            <i class="bi bi-car-front-fill me-1"></i> Browse Cars
        </a>
    </div>
</div>
{% endblock %}
